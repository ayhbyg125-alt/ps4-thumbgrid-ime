name: Build PS4 ThumbGrid IME

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      OO_PS4_TOOLCHAIN: ${{ github.workspace }}/OpenOrbis/PS4Toolchain
      GOLDHEN_SDK: ${{ github.workspace }}/GoldHEN_Plugins_SDK

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            lld \
            llvm \
            make \
            curl \
            ca-certificates \
            git \
            tar

      - name: Download OpenOrbis PS4 Toolchain v0.5.4
        run: |
          curl -fL --retry 3 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o /tmp/toolchain-llvm-18.tar.gz
          mkdir -p "${GITHUB_WORKSPACE}/OpenOrbis"
          tar -xzf /tmp/toolchain-llvm-18.tar.gz -C "${GITHUB_WORKSPACE}/OpenOrbis"
          test -f "${OO_PS4_TOOLCHAIN}/link.x"
          test -x "${OO_PS4_TOOLCHAIN}/bin/linux/create-fself"

      - name: Checkout GoldHEN Plugins SDK
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          path: GoldHEN_Plugins_SDK
          fetch-depth: 1

      - name: Build GoldHEN Plugins SDK
        run: |
          make -C "${GOLDHEN_SDK}"

      - name: Build game-side PRX
        run: |
          make clean
          make

      - name: Build shell-overlay PRX
        working-directory: shell-overlay
        run: |
          make clean
          make

      - name: Verify PRX outputs
        run: |
          test -s "${GITHUB_WORKSPACE}/bin/thumbgrid_ime.prx"
          test -s "${GITHUB_WORKSPACE}/shell-overlay/bin/shell_overlay.prx"
          file "${GITHUB_WORKSPACE}/bin/thumbgrid_ime.prx" "${GITHUB_WORKSPACE}/shell-overlay/bin/shell_overlay.prx"
          sha256sum "${GITHUB_WORKSPACE}/bin/thumbgrid_ime.prx" "${GITHUB_WORKSPACE}/shell-overlay/bin/shell_overlay.prx"

      - name: Upload PRX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps4-thumbgrid-ime-prx
          if-no-files-found: error
          path: |
            bin/thumbgrid_ime.prx
            shell-overlay/bin/shell_overlay.prx
