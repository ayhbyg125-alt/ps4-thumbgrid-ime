name: Build PS4 ThumbGrid IME

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      GOLDHEN_SDK: ${{ github.workspace }}/GoldHEN_Plugins_SDK

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            lld-18 \
            llvm-18 \
            make \
            curl \
            ca-certificates \
            git \
            tar

      - name: Select LLVM 18
        shell: bash
        run: |
          set -euo pipefail
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/lld-18 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-18 /usr/local/bin/llvm-ar
          clang --version
          ld.lld --version
          llvm-ar --version

      - name: Download and locate OpenOrbis PS4 Toolchain v0.5.4
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 --retry-all-errors \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o /tmp/toolchain-llvm-18.tar.gz

          rm -rf "${GITHUB_WORKSPACE}/OpenOrbis"
          mkdir -p "${GITHUB_WORKSPACE}/OpenOrbis"
          tar -xzf /tmp/toolchain-llvm-18.tar.gz -C "${GITHUB_WORKSPACE}/OpenOrbis"

          echo "Archive layout:"
          tar -tzf /tmp/toolchain-llvm-18.tar.gz | head -80

          LINK_X="$(find "${GITHUB_WORKSPACE}/OpenOrbis" -type f -name link.x -print -quit)"
          CREATE_FSELF="$(find "${GITHUB_WORKSPACE}/OpenOrbis" -type f -path '*/bin/linux/create-fself' -print -quit)"

          test -n "${LINK_X}"
          test -n "${CREATE_FSELF}"

          TOOLCHAIN_ROOT="$(dirname "${LINK_X}")"
          test -f "${TOOLCHAIN_ROOT}/link.x"
          test -x "${CREATE_FSELF}"

          echo "Resolved OpenOrbis root: ${TOOLCHAIN_ROOT}"
          echo "Resolved create-fself: ${CREATE_FSELF}"

          echo "OO_PS4_TOOLCHAIN=${TOOLCHAIN_ROOT}" >> "${GITHUB_ENV}"

      - name: Verify OpenOrbis toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -f "${OO_PS4_TOOLCHAIN}/link.x"
          test -x "${OO_PS4_TOOLCHAIN}/bin/linux/create-fself"
          test -x "${OO_PS4_TOOLCHAIN}/bin/linux/clang" || true
          ls -la "${OO_PS4_TOOLCHAIN}"
          ls -la "${OO_PS4_TOOLCHAIN}/bin/linux"

      - name: Checkout GoldHEN Plugins SDK
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          path: GoldHEN_Plugins_SDK
          fetch-depth: 1

      - name: Build GoldHEN Plugins SDK
        shell: bash
        run: |
          set -euo pipefail
          make -C "${GOLDHEN_SDK}"

      - name: Build game-side PRX
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make

      - name: Build shell-overlay PRX
        shell: bash
        working-directory: shell-overlay
        run: |
          set -euo pipefail
          make clean
          make

      - name: Verify PRX outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "${GITHUB_WORKSPACE}/bin/thumbgrid_ime.prx"
          test -s "${GITHUB_WORKSPACE}/shell-overlay/bin/shell_overlay.prx"
          file "${GITHUB_WORKSPACE}/bin/thumbgrid_ime.prx" "${GITHUB_WORKSPACE}/shell-overlay/bin/shell_overlay.prx"
          sha256sum "${GITHUB_WORKSPACE}/bin/thumbgrid_ime.prx" "${GITHUB_WORKSPACE}/shell-overlay/bin/shell_overlay.prx"

      - name: Upload PRX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps4-thumbgrid-ime-prx
          if-no-files-found: error
          path: |
            bin/thumbgrid_ime.prx
            shell-overlay/bin/shell_overlay.prx
