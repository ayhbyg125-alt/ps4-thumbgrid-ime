name: Build PS4 ThumbGrid IME

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      OO_PS4_TOOLCHAIN: ${{ github.workspace }}/OpenOrbis-PS4-Toolchain
      GOLDHEN_SDK: ${{ github.workspace }}/GoldHEN_Plugins_SDK

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             clang             lld             llvm             make             curl             ca-certificates             git             tar

      - name: Download OpenOrbis PS4 Toolchain
        run: |
          mkdir -p "${OO_PS4_TOOLCHAIN}"
          curl -L --fail --retry 3             "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/v0.5.4.tar.gz"             -o /tmp/openorbis.tar.gz
          tar -xzf /tmp/openorbis.tar.gz -C "${OO_PS4_TOOLCHAIN}"

      - name: Checkout GoldHEN Plugins SDK
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          path: GoldHEN_Plugins_SDK
          fetch-depth: 1

      - name: Build GoldHEN Plugins SDK
        run: |
          make -C "${GOLDHEN_SDK}" clean
          make -C "${GOLDHEN_SDK}"

      - name: Build game-side PRX
        run: |
          make clean
          make

      - name: Build shell-overlay PRX
        working-directory: shell-overlay
        run: |
          make clean
          make

      - name: Verify PRX outputs
        run: |
          test -s bin/thumbgrid_ime.prx
          test -s shell-overlay/bin/shell_overlay.prx
          file bin/thumbgrid_ime.prx shell-overlay/bin/shell_overlay.prx
          sha256sum bin/thumbgrid_ime.prx shell-overlay/bin/shell_overlay.prx

      - name: Upload PRX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps4-thumbgrid-ime-prx
          if-no-files-found: error
          path: |
            bin/thumbgrid_ime.prx
            shell-overlay/bin/shell_overlay.prx
